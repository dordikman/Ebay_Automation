version: "3.8"

services:
  selenoid:
    image: aerokube/selenoid:latest
    restart: unless-stopped
    ports:
      - "4444:4444"
    environment:
      - DOCKER_API_VERSION=1.44
    volumes:
      - //var/run/docker.sock:/var/run/docker.sock
      - ./selenoid-config:/etc/selenoid:ro
    command: ["-conf", "/etc/selenoid/browsers.json", "-limit", "4", "-container-network", "ebay_automation_project_grid", "-timeout", "5m", "-service-startup-timeout", "60s"]
    networks:
      - grid

  selenoid-ui:
    image: aerokube/selenoid-ui:latest
    restart: unless-stopped
    ports:
      - "8090:8080"
    command: ["--selenoid-uri", "http://selenoid:4444"]
    depends_on:
      - selenoid
    networks:
      - grid

  # ── Test Runner ──
  # Runs pytest inside a container on the same network as Selenoid.
  # Activated via profile: docker-compose --profile tests up
  tests:
    build: .
    profiles: ["tests"]
    environment:
      - GRID_URL=http://selenoid:4444/wd/hub
    volumes:
      - ./reports:/app/reports
      - ./screenshots:/app/screenshots
      - ./logs:/app/logs
    depends_on:
      - selenoid
    networks:
      - grid

networks:
  grid:
    driver: bridge

# ──────────────────────────────────────────────────────
# Usage:
#   1. Pull browser images first:
#      docker pull selenoid/vnc:chrome_128.0
#      docker pull selenoid/vnc:firefox_125.0
#
#   2. Start Grid only (local dev):
#      docker-compose up -d
#
#   3. Start Grid + run tests in container:
#      docker-compose --profile tests up
#
#   4. Open Selenoid UI dashboard:
#      http://localhost:8090
#
#   5. Run tests locally (without container):
#      pytest tests/ -v --alluredir=reports/allure-results
#
#   6. Stop everything:
#      docker-compose --profile tests down
# ──────────────────────────────────────────────────────
